<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppFrame Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-box">
        <img src="icons/icon48.png" alt="AppFrame Logo" class="logo-img">
        <div class="header-text">
          <h1>AppFrame Companion</h1>
          <span class="badge">v1.0.0</span>
        </div>
      </div>
    </header>

    <!-- YouTube Session Status -->
    <section class="card status-card">
      <div class="card-header">
        <span class="card-title">Sessão do YouTube</span>
        <span id="yt-indicator" class="dot dot-loading"></span>
      </div>
      <p id="yt-status-text" class="status-desc">Verificando sessão no navegador...</p>
    </section>

    <!-- Server Config (Colapsável ou direto) -->
    <section class="card server-card">
      <label for="server-url" class="input-label">Servidor AppFrame:</label>
      <input type="text" id="server-url" value="http://localhost:3000" placeholder="http://localhost:3000" />
    </section>

    <!-- Action Button -->
    <div class="actions">
      <button id="sync-btn" class="btn btn-primary">
        <span class="btn-icon">⚡</span>
        <span id="sync-btn-text">Sincronizar com AppFrame</span>
      </button>
    </div>

    <!-- Feedback Message -->
    <div id="feedback" class="feedback hidden"></div>

    <!-- Footer -->
    <footer class="footer">
      <p>Sincronização 1-clique sem arquivos ou senhas.</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
