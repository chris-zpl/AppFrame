<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Fallback global para glifos Emoji e símbolos usando Noto Emoji (outline vector) e Twemoji -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Plus Jakarta Sans</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Emoji</string>
      <string>Twemoji</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Montserrat</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Emoji</string>
      <string>Twemoji</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Anton</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Emoji</string>
      <string>Twemoji</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Bebas Neue</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Emoji</string>
      <string>Twemoji</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Emoji</string>
      <string>Twemoji</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
