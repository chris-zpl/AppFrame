# ==============================================================================
# Docker Compose - Ambiente de Produção (AppFrame)
# Execução: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# ==============================================================================
services:
  # 1. Banco de Dados Relacional - PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: appframe-postgres
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - appframe-network

  # 2. Broker de Mensageria e Cache - Redis 7 (Protegido com Senha)
  redis:
    image: redis:7-alpine
    container_name: appframe-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - ./.env.production
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - appframe-network

  # 3. Backend API & Workers - NestJS, FFmpeg, BullMQ (Produção)
  backend:
    build:
      context: ./appframe-backend
      dockerfile: Dockerfile
    container_name: appframe-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-https://appframe.com.br}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

      # Conexão interna com os containers na rede Docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      DB_SSL: "false"
      DB_LOGGING: "false"
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: "true"

      # Redis / BullMQ autenticado na rede interna
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Chaves Criptográficas e Segurança
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}

      # Google OAuth 2.0
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://api.appframe.com.br/api/v1/auth/google/callback}

      # Google Gemini AI (Modelo base; chave da API é consumida do PostgreSQL)
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}

      # Processamento de Mídia & FFmpeg
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      YTDLP_PATH: yt-dlp
      TEMP_DIR: storage/temp
    ports:
      - "${BACKEND_PORT:-3002}:3000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/v1/auth/me > /dev/null 2>&1 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - appframe-network

  # 4. Frontend Web - React 19, Vite, Tailwind CSS, Nginx (Produção)
  frontend:
    build:
      context: ./appframe-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.appframe.com.br}
    container_name: appframe-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ./.env.production
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - appframe-network

# ==============================================================================
# Volumes Persistentes & Redes
# ==============================================================================
volumes:
  postgres_data:
  redis_data:
  backend_storage:

networks:
  appframe-network:
    driver: bridge