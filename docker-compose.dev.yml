# ==============================================================================
# Docker Compose - Ambiente de Desenvolvimento (AppFrame)
# Execução: docker compose -f docker-compose.dev.yml --env-file .env.development up -d
# ==============================================================================
services:
  # 1. Banco de Dados Relacional - PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: appframe-postgres
    restart: unless-stopped
    env_file:
      - ./.env.development
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-appframe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appframe}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - appframe-network

  # 2. Broker de Mensageria e Cache - Redis 7
  redis:
    image: redis:7-alpine
    container_name: appframe-redis
    restart: unless-stopped
    env_file:
      - ./.env.development
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - appframe-network

  # 3. Backend API & Workers - NestJS, FFmpeg, BullMQ (Desenvolvimento)
  backend:
    build:
      context: ./appframe-backend
      dockerfile: Dockerfile
    container_name: appframe-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env.development
      - ./appframe-backend/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      # Conexão interna com os containers na rede Docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-appframe}
      DB_SSL: "false"
      DB_LOGGING: "false"
      DB_SYNCHRONIZE: "true"
      DB_MIGRATIONS_RUN: "true"

      # Redis / BullMQ interno na rede Docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # Processamento de Mídia & FFmpeg
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      YTDLP_PATH: yt-dlp
      TEMP_DIR: storage/temp
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/v1/auth/me > /dev/null 2>&1 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - appframe-network

  # 4. Frontend Web - React 19, Vite, Tailwind CSS, Nginx (Desenvolvimento)
  frontend:
    build:
      context: ./appframe-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    container_name: appframe-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ./.env.development
      - ./appframe-frontend/.env
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - appframe-network

volumes:
  postgres_data:
  redis_data:
  backend_storage:

networks:
  appframe-network:
    driver: bridge
